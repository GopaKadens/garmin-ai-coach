
name: Check Telegram Webhook

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check webhook status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]

          url = (
              f"https://api.telegram.org/bot{token}"
              "/getWebhookInfo"
          )

          with urllib.request.urlopen(
              url, timeout=30
          ) as response:
              data = json.load(response)

          if not data.get("ok"):
              raise RuntimeError("Telegram API request failed")

          info = data["result"]

          print("Webhook URL:", info.get("url"))
          print("Pending updates:", info.get("pending_update_count"))
          print("Last error date:", info.get("last_error_date"))
          print("Last error:", info.get("last_error_message"))
          print("Max connections:", info.get("max_connections"))
          PY
